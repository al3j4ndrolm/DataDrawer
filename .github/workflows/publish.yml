name: Publish

# Publishes to GitHub Packages when a version tag (e.g. 1.0.0) is pushed.
on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version=$version in gradle.properties"; exit 1
          fi
      - name: Test and publish
        run: ./gradlew :datadrawer:testDebugUnitTest :datadrawer:publishReleasePublicationToGitHubPackagesRepository :datadrawer-compose:publishReleasePublicationToGitHubPackagesRepository --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
